<style>
:root{--nav:#102b3c;--nav2:#173e55;--accent:#d6a85f;--bg:#f4f5f6;--card:#fff;--text:#17232d;--muted:#71808b;--line:#e3e8eb;--ok:#4e8069;--danger:#b65353;--warn:#a97925;--shadow:0 5px 18px #17232d0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0b2333,#173e55);padding:20px}.loginbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 30px 80px #0005}.logo{font-size:29px;font-weight:850}.logo span{color:var(--accent)}.sub{color:var(--muted);margin:5px 0 26px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:750;color:#52616b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d3dce1;border-radius:10px;background:#fff;outline:0}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7898aa;box-shadow:0 0 0 3px #7898aa22}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--nav);color:#fff}.gold{background:var(--accent);color:#17232d}.soft{background:#edf1f3;color:#29485b}.danger{background:#fff0f0;color:var(--danger)}.ghost{background:transparent;color:#52616b;border:1px solid var(--line)}.login .primary{width:100%;padding:13px;margin-top:8px}.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--nav);color:#fff;padding:23px 14px;z-index:5}.brand{padding:4px 11px 23px;font-size:23px;font-weight:850}.brand small{display:block;color:#aebfc9;font-size:11px;font-weight:500;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd9e1;text-align:left;padding:11px 13px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav button.active:before{content:"";display:inline-block;width:3px;height:18px;background:var(--accent);vertical-align:middle;margin-right:9px;border-radius:2px}.main{margin-left:250px;padding:25px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:28px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat .n{font-size:30px;font-weight:850;margin:5px 0}.stat .l{color:var(--muted);font-size:13px}.section{margin-top:15px}.section h2,.card h2{font-size:17px;margin:0 0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{color:var(--muted);font-weight:700;white-space:nowrap}.table td:last-child{white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4f7;color:#27556f;font-size:11px;font-weight:700}.badge.ok{background:#edf6f0;color:#39715a}.badge.warn{background:#fff6df;color:#87621f}.badge.red{background:#fff0f0;color:#9c4545}.empty{text-align:center;color:var(--muted);padding:32px}.search{display:flex;gap:9px;flex:1;min-width:180px}.search input{width:100%;border:1px solid #d3dce1;border-radius:10px;padding:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.modal{display:none;position:fixed;inset:0;background:#07131dcc;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.close{width:34px;height:34px;border:0;border-radius:50%;background:#edf1f3}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{text-align:left;padding:15px;border:1px solid var(--line);background:#fff;border-radius:12px}.quick b{display:block;margin-top:6px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.calhead{background:#f5f7f8;color:var(--muted);font-size:11px;font-weight:700;padding:9px}.day{min-height:100px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px}.day:nth-child(7n){border-right:0}.daynum{font-weight:750;font-size:12px}.eventchip{margin-top:5px;padding:5px 6px;border-radius:7px;background:#edf4f7;color:#27556f;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.overdue{border-left:3px solid var(--danger);padding-left:8px}.mobile{display:none}
@media(max-width:950px){.side{display:none}.main{margin-left:0;padding:16px 16px 88px}.grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.top h1{font-size:23px}.topright .user{display:none}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--nav);z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile button{background:transparent;border:0;color:#d8e3e8;font-size:10px}.mobile button b{font-size:19px;display:block}.formgrid{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,minmax(85px,1fr));overflow:auto}.day{min-height:85px}.calwrap{overflow:auto}.table th,.table td{font-size:12px}}

.client-picker label{display:block;font-size:12px;font-weight:750;margin-bottom:6px;color:#52616b}
.client-picker-status{font-size:12px;color:var(--muted);padding:8px 0}
.client-picker-results{max-height:280px;overflow:auto;border:1px solid var(--line);border-radius:9px;background:white;margin-bottom:10px}
.client-picker-results[hidden]{display:none}
.client-picker-option{display:block;width:100%;padding:12px;text-align:left;border:0;border-bottom:1px solid var(--line);background:white;color:var(--text);min-height:52px}
.client-picker-option:hover,.client-picker-option:focus-visible{background:#edf2ff;outline:2px solid #7898aa;outline-offset:-2px}
.client-picker-option small{display:block;white-space:normal;margin-top:4px;color:var(--muted);font-size:12px}
.client-picker-empty{padding:12px;font-size:13px}
.day-add{cursor:pointer}.day-add:hover{background:#f6f9ff}
.day-add-button{display:flex;align-items:center;justify-content:space-between;gap:4px;width:100%;min-height:34px;background:transparent;border:0;text-align:left;padding:0;color:inherit}

button.eventchip{display:block;width:100%;border:0;text-align:left;cursor:pointer}

.calendar-period{margin:0;min-width:190px;text-align:center}
.calendar-hint{font-size:12px;color:var(--muted);margin:14px 0}

.calendar-week .day{min-height:280px;padding:10px}.calendar-today{background:#f0f7ff;box-shadow:inset 0 3px #427da3}
.calendar-event{margin-top:10px;padding:9px;background:#edf4f7;border-left:3px solid #427da3;border-radius:7px;cursor:default}
.calendar-event-task,.calendar-event-client{display:block;width:100%;border:0;background:transparent;text-align:left;color:var(--text);padding:3px 0;white-space:normal;overflow-wrap:anywhere}

.calendar-free{font-size:11px;color:var(--muted);margin-top:20px}.calendar-month .calendar-event{padding:5px}

.event-contact-dialog{background:white;width:min(640px,100%);max-height:88vh;overflow:auto;border-radius:14px;padding:24px;box-shadow:0 20px 80px #0004}

</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">S.D <span>Chauffage</span></div><div class="sub">Application de gestion métier</div><div class="field"><label>E-mail</label><input id="lu" type="email" autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn primary" onclick="login()">Se connecter</button><div class="hint">Version 1.0 · Compte partagé S.D Chauffage</div></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">S.D Chauffage<small>Gestion métier · Version 1.0</small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><h1 id="title"></h1><div class="topright"><span class="user">Administrateur</span><button class="btn soft" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main><nav id="mobile" class="mobile"></nav></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<script>
const KEY='sdchauffage-v2';
const blank={inventory:[],clients:[],events:[],jobs:[],maint:[],quotes:[],invoices:[],docs:[],reminders:[],services:[],settings:{company:'S.D Chauffage',phone:'',email:'',address:'',vat:'',user:'Administrateur'}};
let db=load(); let page='home'; let calDate=new Date();let agendaView='week';
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?merge(blank,x):JSON.parse(JSON.stringify(blank))}catch(e){return JSON.parse(JSON.stringify(blank))}}
function merge(a,b){const o=JSON.parse(JSON.stringify(a));Object.keys(b||{}).forEach(k=>o[k]=b[k]);return o}
let save=()=>localStorage.setItem(KEY,JSON.stringify(db));const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const nav=[['home','⌂','Accueil'],['clients','♙','Clients'],['agenda','▣','Agenda'],['jobs','⚒','Interventions'],['maint','◷','Entretiens'],['quotes','□','Devis'],['invoices','▤','Factures'],['docs','▤','Documents'],['reminders','◉','Rappels'],['inventory','📦','Inventaire'],['settings','⚙','Administration']];
function login(){alert('La connexion partagée est en cours de chargement. Actualise la page si nécessaire.')}
function logout(){sessionStorage.removeItem('sd2');location.reload()}function start(){$('login').style.display='none';$('app').style.display='flex';drawNav();render()}
function drawNav(){const h=nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('');$('nav').innerHTML=h;$('mobile').innerHTML=nav.slice(0,5).map(n=>`<button onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}
function go(p){page=p;drawNav();render();scrollTo(0,0)}function render(){$('title').textContent=nav.find(n=>n[0]===page)[2];({home,clients,agenda,jobs,maint,quotes,invoices,docs,reminders,inventory,settings}[page])()}
function today(){return new Date().toISOString().slice(0,10)}function fmt(d){if(!d)return '—';const [y,m,day]=d.split('-');return y&&m&&day?`${day}/${m}/${y}`:d}
function clientOptions(selected=''){return `<option value="">Sélectionner</option>`+db.clients.map(c=>`<option ${c.name===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function home(){const upcoming=[...db.events].filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);const due=db.maint.filter(m=>m.next&&m.next<=today()).length;const unpaid=db.invoices.filter(i=>i.status==='Impayée').length;$('content').innerHTML=`<div class="grid"><div class="card stat"><div>♙</div><div class="n">${db.clients.length}</div><div class="l">Clients</div></div><div class="card stat"><div>▣</div><div class="n">${db.events.length}</div><div class="l">Rendez-vous</div></div><div class="card stat"><div>⚒</div><div class="n">${db.jobs.length}</div><div class="l">Interventions</div></div><div class="card stat"><div>◷</div><div class="n">${due}</div><div class="l">Entretiens à prévoir</div></div></div><div class="section card"><h2>Actions rapides</h2><div class="quick"><button onclick="openClient()">👤<b>Nouveau client</b><small>Créer une fiche</small></button><button onclick="openEvent()">📅<b>Nouveau rendez-vous</b><small>Ajouter à l'agenda</small></button><button onclick="openJob()">🔧<b>Nouvelle intervention</b><small>Rapport de travail</small></button><button onclick="openQuote()">📄<b>Nouveau devis</b><small>Créer un devis</small></button></div></div><div class="grid3 section"><div class="card"><h2>Prochains rendez-vous</h2>${upcoming.map(e=>`<div class="row"><span><b>${esc(e.client||'Sans client')}</b><br><small>${fmt(e.date)} · ${esc(e.time)} · ${esc(e.type)}</small></span><span class="badge">${esc(e.status||'Planifié')}</span></div>`).join('')||'<div class="empty">Aucun rendez-vous.</div>'}</div><div class="card"><h2>Alertes</h2><div class="row"><span>Entretiens à prévoir</span><b>${due}</b></div><div class="row"><span>Factures impayées</span><b>${unpaid}</b></div><div class="row"><span>Rappels</span><b>${db.reminders.filter(r=>!r.done).length}</b></div></div><div class="card"><h2>Chiffre facturé</h2><div class="n" style="font-size:28px;font-weight:850">${db.invoices.reduce((s,i)=>s+Number(i.total||0),0).toFixed(2)} €</div><small style="color:var(--muted)">Total des factures enregistrées</small></div></div>`}
function clients(){const q=($('cq')?.value||'').toLowerCase();$('content').innerHTML=`<div class="card"><div class="actions between"><div class="search"><input id="cq" value="${esc(q)}" placeholder="Rechercher nom, téléphone, ville..." oninput="clients()"></div><button class="btn primary" onclick="openClient()">+ Nouveau client</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Client</th><th>Téléphone</th><th>Adresse</th><th>Dernière intervention</th><th></th></tr></thead><tbody>${db.clients.map((c,i)=>({c,i})).filter(o=>(o.c.name+' '+o.c.phone+' '+o.c.city).toLowerCase().includes(q)).map(o=>`<tr><td><b>${esc(o.c.name)}</b><br><small>${esc(o.c.email)}</small></td><td>${esc(o.c.phone)}</td><td>${esc(o.c.address)}<br>${esc(o.c.zip)} ${esc(o.c.city)}</td><td>${fmt(o.c.last)}</td><td><button class="btn soft" onclick="openClient(${o.i})">Ouvrir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun client.</td></tr>'}</tbody></table></div></div>`}
function openClient(i=null){const c=i==null?{name:'',phone:'',email:'',address:'',zip:'',city:'',notes:'',last:''}:db.clients[i];$('mt').textContent=i==null?'Nouveau client':'Fiche client';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Nom / prénom</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Téléphone</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>E-mail</label><input id="ce" value="${esc(c.email)}"></div><div class="field"><label>Adresse</label><input id="ca" value="${esc(c.address)}"></div><div class="field"><label>Code postal</label><input id="cz" value="${esc(c.zip)}"></div><div class="field"><label>Ville</label><input id="cv" value="${esc(c.city)}"></div></div><div class="field"><label>Notes</label><textarea id="co">${esc(c.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveClient(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('clients',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveClient(i){const c={...(i!==null?db.clients[i]:{}),name:$('cn').value.trim(),phone:$('cp').value,email:$('ce').value,address:$('ca').value,zip:$('cz').value,city:$('cv').value,notes:$('co').value,last:i!==null?db.clients[i].last:''};if(!c.name)return alert('Le nom du client est obligatoire.');i===null?db.clients.push(c):db.clients[i]=c;save();closeModal();render()}
function clientPickerNormalise(value){return String(value??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('fr-BE');}
function clientPickerMatches(query){const words=clientPickerNormalise(query).split(/\s+/).filter(Boolean);return db.clients.map((client,index)=>({client,index})).filter(({client})=>words.every(word=>clientPickerNormalise([client.name,client.address,client.zip,client.city,client.phone,client.email].join(' ')).includes(word))).sort((a,b)=>String(a.client.name).localeCompare(String(b.client.name),'fr'));}
function clientPickerHTML(id,selected='',change='',selectedId=''){const index=db.clients.findIndex(c=>selectedId?c._syncId===selectedId:c.name===selected);return `<div class="client-picker"><label for="${id}-search">Rechercher un client</label><input id="${id}-search" type="search" autocomplete="off" value="${esc(selected)}" placeholder="Nom, adresse, ville ou téléphone…" oninput="clientPickerSearch('${id}',true)" onfocus="clientPickerSearch('${id}')" onkeydown="clientPickerKey(event,'${id}')" aria-controls="${id}-results"><input id="${id}" type="hidden" value="${esc(selected)}" data-client-index="${index}" onchange="${change}"><div id="${id}-status" class="client-picker-status" role="status" aria-live="polite">${selected?'Client sélectionné : '+esc(selected):'Tape quelques lettres puis touche le client dans les résultats.'}</div><div id="${id}-results" class="client-picker-results" hidden></div></div>`;}
function clientPickerSearch(id,editing=false){const input=$(id+'-search'),value=$(id),results=$(id+'-results'),status=$(id+'-status');if(!input||!value||!results)return;if(editing&&input.value!==value.value){value.value='';value.dataset.clientIndex='-1';value.dispatchEvent(new Event('change',{bubbles:true}));}const matches=clientPickerMatches(input.value);results.hidden=false;results.innerHTML=matches.slice(0,30).map(({client:c,index})=>`<button type="button" class="client-picker-option" onclick="clientPickerSelect('${id}',${index})"><b>${esc(c.name)}</b><small>${esc([c.address,[c.zip,c.city].filter(Boolean).join(' '),c.phone].filter(Boolean).join(' · '))}</small></button>`).join('')||'<p class="client-picker-empty">Aucun client trouvé. Tu peux en créer un ci-dessous.</p>';status.textContent=matches.length+' résultat'+(matches.length===1?'':'s')+(matches.length>30?' · précise la recherche pour afficher moins de clients.':'');}
function clientPickerSelect(id,index){const c=db.clients[index],value=$(id),input=$(id+'-search');if(!c||!value||!input)return;value.value=c.name;value.dataset.clientIndex=String(index);input.value=c.name;$(id+'-results').hidden=true;$(id+'-status').textContent='Client sélectionné : '+c.name;value.dispatchEvent(new Event('change',{bubbles:true}));}
function clientPickerKey(event,id){if(event.key==='Escape'){$(id+'-results').hidden=true;}else if(event.key==='ArrowDown'){event.preventDefault();$(id+'-results').querySelector('button')?.focus();}else if(event.key==='Enter'){event.preventDefault();const matches=clientPickerMatches($(id+'-search').value);if(matches.length===1)clientPickerSelect(id,matches[0].index);}}
function openEventOnDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date))return;openEvent(null,date);}
function calendarDate(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;}
function calendarMonday(date){const start=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);start.setDate(start.getDate()-(start.getDay()+6)%7);return start;}
function calendarRange(){if(agendaView==='week'){const start=calendarMonday(calDate),end=new Date(start);end.setDate(end.getDate()+6);return {start,end};}return {start:new Date(calDate.getFullYear(),calDate.getMonth(),1,12),end:new Date(calDate.getFullYear(),calDate.getMonth()+1,0,12)};}
function eventClientRecord(e){if(!e)return null;if(e.clientId)return db.clients.find(c=>c._syncId===e.clientId)||null;const matches=db.clients.filter(c=>c.name===e.client);return matches.length===1?matches[0]:null;}
function eventAddress(c){return c?[c.address,[c.zip,c.city].filter(Boolean).join(' ')].filter(Boolean).join(', '):'';}
function eventContactMarkup(c,full=false){if(!c)return '<p class="event-contact-empty">Choisis un client dans la recherche pour afficher son adresse et son téléphone. Si plusieurs fiches portent le même nom, sélectionne la bonne adresse.</p>';const address=eventAddress(c),telephone=number=>String(number||'').replace(/[^\d+*#]/g,'');return `<div class="event-contact">${full?`<h3>${esc(c.name)}</h3>`:`<button type="button" class="event-client-name" onclick="openEventClientInfo()">${esc(c.name)} <small>Voir la fiche client ›</small></button>`}<p><b>Adresse</b><br>${esc(address||'Adresse non renseignée')}</p><div class="actions">${address?`<a class="btn soft" href="https://maps.apple.com/?q=${encodeURIComponent(address)}" target="_blank" rel="noopener noreferrer">Ouvrir le plan</a>`:''}${telephone(c.phone)?`<a class="btn soft" href="tel:${esc(telephone(c.phone))}">Appeler ${esc(c.phone)}</a>`:''}</div>${!c.phone?'<p>Téléphone non renseigné</p>':''}${full?`${c.phone2?`<p><b>Autre téléphone</b><br><a href="tel:${esc(telephone(c.phone2))}">${esc(c.phone2)}</a></p>`:''}${c.email?`<p><b>E-mail</b><br><a href="mailto:${encodeURIComponent(c.email)}">${esc(c.email)}</a></p>`:''}${c.vat?`<p><b>TVA</b><br>${esc(c.vat)}</p>`:''}${c.notes?`<p class="event-contact-notes"><b>Notes client</b><br>${esc(c.notes)}</p>`:''}`:''}</div>`;}
function eventClientChanged(input){const index=Number(input.dataset.clientIndex),c=db.clients[index];$('event-contact-summary').innerHTML=eventContactMarkup(c&&c.name===input.value?c:null);}
function openEventClientInfo(){const input=$('ec'),c=db.clients[Number(input?.dataset.clientIndex)];if(!c||c.name!==input.value)return alert('Choisis d’abord le client dans les résultats de recherche.');$('event-contact-body').innerHTML=eventContactMarkup(c,true);$('event-contact-sheet').hidden=false;$('event-contact-close').focus();}
function closeEventClientInfo(){$('event-contact-sheet').hidden=true;}
function openCalendarClient(index){openEvent(index);openEventClientInfo();}
function calendarEventCard(e,index){const c=eventClientRecord(e);return `<article class="calendar-event ${e.status==='Annulé'?'calendar-event-cancelled':''}" onclick="event.stopPropagation();openEvent(${index})"><button type="button" class="calendar-event-task" onclick="event.stopPropagation();openEvent(${index})"><b>${esc(e.time||'Heure à préciser')}</b><span>${esc(e.type||'Rendez-vous')}</span></button><button type="button" class="calendar-event-client" onclick="event.stopPropagation();openCalendarClient(${index})">${esc(c?.name||e.client||'Client à préciser')}</button>${eventAddress(c)?`<small>${esc(eventAddress(c))}</small>`:''}<span class="calendar-event-status">${esc(e.status||'Planifié')}</span></article>`;}
function agenda(){const {start,end}=calendarRange(),from=calendarDate(start),to=calendarDate(end),week=agendaView==='week';let cells='';const dayNames=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];let dates=[];if(week){for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push(d);}}else{const offset=(start.getDay()+6)%7;for(let i=0;i<offset;i++)dates.push(null);for(let d=1;d<=end.getDate();d++)dates.push(new Date(start.getFullYear(),start.getMonth(),d,12));}
if(!week)cells=dayNames.map(name=>`<div class="calhead">${name}</div>`).join('');
dates.forEach((date,i)=>{if(!date){cells+='<div class="day"></div>';return;}const ds=calendarDate(date),events=db.events.map((e,index)=>({e,index})).filter(({e})=>e.date===ds).sort((a,b)=>String(a.e.time||'').localeCompare(String(b.e.time||'')));cells+=`<div class="day day-add ${ds===today()?'calendar-today':''}" onclick="openEventOnDate('${ds}')"><button type="button" class="daynum day-add-button" aria-label="Ajouter un rendez-vous le ${fmt(ds)}" onclick="event.stopPropagation();openEventOnDate('${ds}')"><b>${week?dayNames[i]+' ':''}${date.getDate()}${week?'/'+String(date.getMonth()+1).padStart(2,'0'):''}</b><span>+ RDV</span></button>${events.map(({e,index})=>calendarEventCard(e,index)).join('')}${week&&!events.length?'<p class="calendar-free">Aucun rendez-vous</p>':''}</div>`;});
const label=week?`${new Intl.DateTimeFormat('fr-BE',{day:'numeric',month:'short'}).format(start)} – ${new Intl.DateTimeFormat('fr-BE',{day:'numeric',month:'short',year:'numeric'}).format(end)}`:new Intl.DateTimeFormat('fr-BE',{month:'long',year:'numeric'}).format(start);
$('content').innerHTML=`<div class="card"><div class="actions between"><div class="actions"><button type="button" class="btn soft" aria-label="${week?'Semaine':'Mois'} précédent" onclick="calendarMove(-1)">‹</button><h2 class="calendar-period">${esc(label)}</h2><button type="button" class="btn soft" aria-label="${week?'Semaine':'Mois'} suivant" onclick="calendarMove(1)">›</button><button type="button" class="btn ghost" onclick="calendarToday()">Aujourd’hui</button></div><div class="actions"><button type="button" class="btn ${week?'primary':'soft'}" aria-pressed="${week}" onclick="calendarSetView('week')">Semaine</button><button type="button" class="btn ${week?'soft':'primary'}" aria-pressed="${!week}" onclick="calendarSetView('month')">Mois</button><button type="button" class="btn primary" onclick="openEvent()">+ Rendez-vous</button></div></div><p class="calendar-hint">Touche un jour pour ajouter un rendez-vous. Touche une tâche pour l’ouvrir ou le nom du client pour ses coordonnées.</p><div class="calwrap"><div class="calendar ${week?'calendar-week':'calendar-month'}">${cells}</div></div></div><div class="section card"><h2>${week?'Rendez-vous de la semaine':'Rendez-vous du mois'}</h2>${eventTable(from,to)}</div>`;}
function calendarSetView(view){if(!['week','month'].includes(view))return;agendaView=view;agenda();}
function calendarMove(step){if(agendaView==='week')calDate.setDate(calDate.getDate()+7*step);else{calDate.setDate(1);calDate.setMonth(calDate.getMonth()+step);}agenda();}
function calendarToday(){calDate=new Date();agenda();}
function changeMonth(step){calDate.setDate(1);calDate.setMonth(calDate.getMonth()+step);agenda();}
function eventTable(from='',to=''){const arr=db.events.map((e,index)=>({e,index})).filter(({e})=>(!from||e.date>=from)&&(!to||e.date<=to)).sort((a,b)=>(a.e.date+(a.e.time||'')).localeCompare(b.e.date+(b.e.time||'')));return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Heure</th><th>Client et adresse</th><th>À faire</th><th>Statut</th><th></th></tr></thead><tbody>${arr.map(({e,index})=>`<tr><td>${fmt(e.date)}</td><td>${esc(e.time)}</td><td><button type="button" class="event-client-name" onclick="openCalendarClient(${index})">${esc(eventClientRecord(e)?.name||e.client)}</button><small class="calendar-table-address">${esc(eventAddress(eventClientRecord(e)))}</small></td><td><button type="button" class="event-task-link" onclick="openEvent(${index})">${esc(e.type)}</button></td><td><span class="badge">${esc(e.status)}</span></td><td><button type="button" class="btn soft" onclick="openEvent(${index})">Ouvrir</button> <button type="button" class="btn danger" onclick="remove('events',${index})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Aucun rendez-vous sur cette période.</td></tr>'}</tbody></table></div>`;}
function openEvent(i=null,selectedDate=today()){let e=i===null?{client:'',date:selectedDate,time:'09:00',type:'Entretien chaudière',status:'Planifié',notes:''}:db.events[i];if(!e)return;const linkedClient=eventClientRecord(e);if(linkedClient)e={...e,client:linkedClient.name};const pickerId=linkedClient?._syncId||(!linkedClient&&e.client?'__unresolved__':'');$('mt').textContent=i===null?'Nouveau rendez-vous':'Modifier le rendez-vous';$('mb').innerHTML=`<section id="event-contact-summary" class="event-contact-summary">${eventContactMarkup(linkedClient)}</section><div class="formgrid"><div class="field">${clientPickerHTML('ec',e.client,'eventClientChanged(this)',pickerId)}<button type="button" id="event-new-client" aria-expanded="false" aria-controls="event-client-form" class="btn soft" style="margin-top:8px" onclick="toggleEventClient(true)">+ Nouveau client</button></div><div class="field"><label>Date</label><input id="ed" type="date" value="${esc(e.date)}"></div><div class="field"><label>Heure</label><input id="et" type="time" value="${esc(e.time)}"></div><div class="field"><label>Type</label><input id="ey" value="${esc(e.type)}"></div><div class="field"><label>Statut</label><select id="es">${['Planifié','Confirmé','Terminé','Annulé'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><section id="event-client-form" class="card" hidden style="margin:12px 0"><h3 style="margin-top:0">Nouveau client</h3><div class="formgrid"><div class="field"><label for="ecn">Nom / prénom *</label><input id="ecn" autocomplete="name"></div><div class="field"><label for="ecp">Téléphone</label><input id="ecp" type="tel" autocomplete="tel"></div><div class="field"><label for="ece">E-mail</label><input id="ece" type="email" autocomplete="email"></div><div class="field"><label for="eca">Adresse</label><input id="eca" autocomplete="street-address"></div><div class="field"><label for="ecz">Code postal</label><input id="ecz" autocomplete="postal-code"></div><div class="field"><label for="ecv">Ville</label><input id="ecv" autocomplete="address-level2"></div></div><div class="field"><label for="eco">Notes client</label><textarea id="eco"></textarea></div><div class="actions"><button type="button" class="btn primary" onclick="saveEventClient()">Enregistrer le client</button><button type="button" class="btn ghost" onclick="toggleEventClient(false)">Annuler</button></div></section><div class="field"><label>Notes</label><textarea id="en">${esc(e.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveEvent(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('events',${i})">Supprimer</button>`:''}</div><section id="event-contact-sheet" class="event-contact-sheet" hidden onkeydown="if(event.key==='Escape'){event.stopPropagation();closeEventClientInfo()}"><div class="event-contact-dialog" role="dialog" aria-modal="true" aria-label="Fiche client"><div class="actions between"><h2>Fiche client</h2><button type="button" class="btn ghost" id="event-contact-close" onclick="closeEventClientInfo()">Fermer</button></div><div id="event-contact-body"></div></div></section>`;$('modal').classList.add('open')}
function toggleEventClient(show){$('event-client-form').hidden=!show;$('event-new-client').setAttribute('aria-expanded',String(show));if(show)$('ecn').focus()}
function saveEventClient(){
  const name=$('ecn').value.trim();
  if(!name){alert('Le nom du client est obligatoire.');$('ecn').focus();return;}
  if(!$('ece').checkValidity()){$('ece').reportValidity();return;}
  const c={name,phone:$('ecp').value.trim(),email:$('ece').value.trim(),address:$('eca').value.trim(),zip:$('ecz').value.trim(),city:$('ecv').value.trim(),notes:$('eco').value,last:''};
  db.clients.push(c);save();
  clientPickerSelect('ec',db.clients.length-1);
  ['ecn','ecp','ece','eca','ecz','ecv','eco'].forEach(id=>$(id).value='');
  toggleEventClient(false);$('ec-search').focus();
}

function saveDoc(key,i){const x={number:$('dnum').value,client:$('docc').value,date:$('docd').value,total:$('doct').value,status:$('docsx').value,description:$('docdesc').value};i===null?db[key].push(x):db[key][i]=x;save();closeModal();render()}

function saveSettings(){db.settings={company:$('sn').value,phone:$('sp').value,email:$('se').value,vat:$('sv').value,address:$('sa').value,user:$('su').value};save();alert('Paramètres enregistrés.');render()}

<script>
// Liste de matériel manquant, conservée avec les données existantes.
let inventoryQuery = '';
let inventoryStatus = '';
function inventory() {
  $('content').innerHTML = `<div class="card">
    <div class="actions between"><div><h2>Matériel à commander</h2><p style="color:var(--muted)">Note les gicleurs et les pièces qu’il te manque.</p></div>
    <button class="btn primary" onclick="openInventory()">+ Ajouter du matériel</button></div>
    <div class="actions section"><div class="search"><input aria-label="Rechercher du matériel" placeholder="Rechercher une référence, une marque…" value="${esc(inventoryQuery)}" oninput="inventoryQuery=this.value;filterInventory()"></div>
    <select aria-label="Filtrer par statut" class="btn soft" onchange="inventoryStatus=this.value;filterInventory()"><option value="">Tous les statuts</option>${['À commander','Commandé','Reçu'].map(s=>`<option ${inventoryStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>
    <div class="tablewrap section"><table class="table"><thead><tr><th>Matériel / référence</th><th>Quantité</th><th>Statut</th><th>Notes</th><th></th></tr></thead><tbody id="inventory-list"></tbody></table></div></div>`;
  filterInventory();
}
function filterInventory() {
  const q=inventoryQuery.trim().toLocaleLowerCase('fr');
  $('inventory-list').innerHTML=db.inventory.map((x,i)=>({x,i})).filter(({x})=>(!inventoryStatus||x.status===inventoryStatus)&&[x.reference,x.notes].join(' ').toLocaleLowerCase('fr').includes(q)).map(({x,i})=>`<tr><td><b>${esc(x.reference)}</b></td><td>${esc(x.quantity)}</td><td><span class="badge ${x.status==='Reçu'?'ok':x.status==='À commander'?'warn':''}">${esc(x.status)}</span></td><td style="white-space:pre-wrap">${esc(x.notes)}</td><td><button class="btn soft" onclick="openInventory(${i})">Modifier</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun matériel dans cette liste.</td></tr>';
}
function openInventory(i=null) {
  const x=i===null?{reference:'',quantity:1,status:'À commander',notes:''}:db.inventory[i];
  if(!x)return;
  $('mt').textContent=i===null?'Ajouter du matériel':'Modifier le matériel';
  $('mb').innerHTML=`<form onsubmit="event.preventDefault();saveInventory(${i===null?'null':i})">
    <div class="field"><label for="inv-reference">Matériel / référence du gicleur</label><input id="inv-reference" required maxlength="200" placeholder="Ex. : Delavan 0,85 — 45° B" value="${esc(x.reference)}"></div>
    <div class="formgrid"><div class="field"><label for="inv-quantity">Quantité à commander</label><input id="inv-quantity" type="number" required min="1" max="9999" step="1" value="${esc(x.quantity)}"></div>
    <div class="field"><label for="inv-status">Statut</label><select id="inv-status">${['À commander','Commandé','Reçu'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div>
    <div class="field"><label for="inv-notes">Notes / fournisseur</label><textarea id="inv-notes" maxlength="2000" placeholder="Marque, modèle de chaudière, fournisseur…">${esc(x.notes)}</textarea></div>
    <div class="actions"><button type="submit" class="btn primary">Enregistrer</button><button type="button" class="btn ghost" onclick="closeModal()">Annuler</button>${i!==null?`<button type="button" class="btn danger" onclick="remove('inventory',${i})">Supprimer</button>`:''}</div>
  </form>`;
  $('modal').classList.add('open');
}
function saveInventory(i) {
  const reference=$('inv-reference').value.trim();
  const quantity=Number($('inv-quantity').value);
  if(!reference||!Number.isInteger(quantity)||quantity<1||quantity>9999)return;
  const x={...(i!==null?db.inventory[i]:{}),reference,quantity,status:$('inv-status').value,notes:$('inv-notes').value.trim()};
  if(i===null)db.inventory.push(x);else db.inventory[i]=x;
  save();closeModal();render();
}
const homeWithTiffanyDesign=window.home;
window.home=function(){
  homeWithTiffanyDesign();
  const tiles=document.querySelector('.tiffany-tiles');
  if(tiles){
    const tile=document.createElement('button');
    tile.className='tiffany-tile teal';
    tile.onclick=()=>go('inventory');
    const count=db.inventory.filter(x=>x.status==='À commander').length;
    tile.innerHTML=`<span class="ti">📦</span><strong>Inventaire ›</strong><small>Gicleurs et matériel manquant<br>${count} référence${count>1?'s':''} à commander</small>`;
    tiles.insertBefore(tile,tiles.lastElementChild);
  }
};
if(sessionStorage.sd2==='1'){drawNav();render();}
</script>
