<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102B3C"><title>S.D Chauffage — V2</title>
<style>
:root{--nav:#102b3c;--nav2:#173e55;--accent:#d6a85f;--bg:#f4f5f6;--card:#fff;--text:#17232d;--muted:#71808b;--line:#e3e8eb;--ok:#4e8069;--danger:#b65353;--warn:#a97925;--shadow:0 5px 18px #17232d0a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0b2333,#173e55);padding:20px}.loginbox{width:min(420px,100%);background:#fff;border-radius:24px;padding:34px;box-shadow:0 30px 80px #0005}.logo{font-size:29px;font-weight:850}.logo span{color:var(--accent)}.sub{color:var(--muted);margin:5px 0 26px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:750;color:#52616b;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d3dce1;border-radius:10px;background:#fff;outline:0}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#7898aa;box-shadow:0 0 0 3px #7898aa22}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.primary{background:var(--nav);color:#fff}.gold{background:var(--accent);color:#17232d}.soft{background:#edf1f3;color:#29485b}.danger{background:#fff0f0;color:var(--danger)}.ghost{background:transparent;color:#52616b;border:1px solid var(--line)}.login .primary{width:100%;padding:13px;margin-top:8px}.hint{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:250px;background:var(--nav);color:#fff;padding:23px 14px;z-index:5}.brand{padding:4px 11px 23px;font-size:23px;font-weight:850}.brand small{display:block;color:#aebfc9;font-size:11px;font-weight:500;margin-top:4px}.nav button{display:block;width:100%;border:0;background:transparent;color:#cbd9e1;text-align:left;padding:11px 13px;border-radius:10px;margin:2px 0}.nav button:hover,.nav button.active{background:var(--nav2);color:#fff}.nav button.active:before{content:"";display:inline-block;width:3px;height:18px;background:var(--accent);vertical-align:middle;margin-right:9px;border-radius:2px}.main{margin-left:250px;padding:25px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:28px}.topright{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.stat .n{font-size:30px;font-weight:850;margin:5px 0}.stat .l{color:var(--muted);font-size:13px}.section{margin-top:15px}.section h2,.card h2{font-size:17px;margin:0 0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 9px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}.table th{color:var(--muted);font-weight:700;white-space:nowrap}.table td:last-child{white-space:nowrap}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4f7;color:#27556f;font-size:11px;font-weight:700}.badge.ok{background:#edf6f0;color:#39715a}.badge.warn{background:#fff6df;color:#87621f}.badge.red{background:#fff0f0;color:#9c4545}.empty{text-align:center;color:var(--muted);padding:32px}.search{display:flex;gap:9px;flex:1;min-width:180px}.search input{width:100%;border:1px solid #d3dce1;border-radius:10px;padding:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.modal{display:none;position:fixed;inset:0;background:#07131dcc;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.modalbox{width:min(760px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:19px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modalhead h2{margin:0}.close{width:34px;height:34px;border:0;border-radius:50%;background:#edf1f3}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick button{text-align:left;padding:15px;border:1px solid var(--line);background:#fff;border-radius:12px}.quick b{display:block;margin-top:6px}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.calendar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden}.calhead{background:#f5f7f8;color:var(--muted);font-size:11px;font-weight:700;padding:9px}.day{min-height:100px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);padding:7px}.day:nth-child(7n){border-right:0}.daynum{font-weight:750;font-size:12px}.eventchip{margin-top:5px;padding:5px 6px;border-radius:7px;background:#edf4f7;color:#27556f;font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.overdue{border-left:3px solid var(--danger);padding-left:8px}.mobile{display:none}
@media(max-width:950px){.side{display:none}.main{margin-left:0;padding:16px 16px 88px}.grid{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}.quick{grid-template-columns:1fr 1fr}.top h1{font-size:23px}.topright .user{display:none}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--nav);z-index:10;padding:7px 4px calc(7px + env(safe-area-inset-bottom));justify-content:space-around}.mobile button{background:transparent;border:0;color:#d8e3e8;font-size:10px}.mobile button b{font-size:19px;display:block}.formgrid{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,minmax(85px,1fr));overflow:auto}.day{min-height:85px}.calwrap{overflow:auto}.table th,.table td{font-size:12px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="logo">S.D <span>Chauffage</span></div><div class="sub">Application de gestion métier</div><div class="field"><label>Identifiant</label><input id="lu" value="admin" autocomplete="username"></div><div class="field"><label>Mot de passe</label><input id="lp" type="password" value="sdchauffage" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div><button class="btn primary" onclick="login()">Se connecter</button><div class="hint">Version test · données enregistrées sur cet appareil</div></div></div>
<div id="app" class="app"><aside class="side"><div class="brand">S.D Chauffage<small>Gestion métier</small></div><div id="nav" class="nav"></div></aside><main class="main"><div class="top"><h1 id="title"></h1><div class="topright"><span class="user">Administrateur</span><button class="btn soft" onclick="logout()">Déconnexion</button></div></div><div id="content"></div></main><nav id="mobile" class="mobile"></nav></div>
<div id="modal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="mt"></h2><button class="close" onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<script>
const KEY='sdchauffage-v2';
const blank={clients:[],events:[],jobs:[],maint:[],quotes:[],invoices:[],docs:[],reminders:[],services:[],settings:{company:'S.D Chauffage',phone:'',email:'',address:'',vat:'',user:'Administrateur'}};
let db=load(); let page='home'; let calDate=new Date();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x?merge(blank,x):JSON.parse(JSON.stringify(blank))}catch(e){return JSON.parse(JSON.stringify(blank))}}
function merge(a,b){const o=JSON.parse(JSON.stringify(a));Object.keys(b||{}).forEach(k=>o[k]=b[k]);return o}
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const nav=[['home','⌂','Accueil'],['clients','♙','Clients'],['agenda','▣','Agenda'],['jobs','⚒','Interventions'],['maint','◷','Entretiens'],['quotes','□','Devis'],['invoices','▤','Factures'],['docs','▤','Documents'],['reminders','◉','Rappels'],['settings','⚙','Administration']];
function login(){if($('lu').value==='admin'&&$('lp').value==='sdchauffage'){sessionStorage.sd2='1';start()}else alert('Identifiant ou mot de passe incorrect.')}
function logout(){sessionStorage.removeItem('sd2');location.reload()}function start(){$('login').style.display='none';$('app').style.display='flex';drawNav();render()}
function drawNav(){const h=nav.map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</button>`).join('');$('nav').innerHTML=h;$('mobile').innerHTML=nav.slice(0,5).map(n=>`<button onclick="go('${n[0]}')"><b>${n[1]}</b>${n[2]}</button>`).join('')}
function go(p){page=p;drawNav();render();scrollTo(0,0)}function render(){$('title').textContent=nav.find(n=>n[0]===page)[2];({home,clients,agenda,jobs,maint,quotes,invoices,docs,reminders,settings}[page])()}
function today(){return new Date().toISOString().slice(0,10)}function fmt(d){if(!d)return '—';const [y,m,day]=d.split('-');return y&&m&&day?`${day}/${m}/${y}`:d}
function clientOptions(selected=''){return `<option value="">Sélectionner</option>`+db.clients.map(c=>`<option ${c.name===selected?'selected':''}>${esc(c.name)}</option>`).join('')}
function home(){const upcoming=[...db.events].filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);const due=db.maint.filter(m=>m.next&&m.next<=today()).length;const unpaid=db.invoices.filter(i=>i.status==='Impayée').length;$('content').innerHTML=`<div class="grid"><div class="card stat"><div>♙</div><div class="n">${db.clients.length}</div><div class="l">Clients</div></div><div class="card stat"><div>▣</div><div class="n">${db.events.length}</div><div class="l">Rendez-vous</div></div><div class="card stat"><div>⚒</div><div class="n">${db.jobs.length}</div><div class="l">Interventions</div></div><div class="card stat"><div>◷</div><div class="n">${due}</div><div class="l">Entretiens à prévoir</div></div></div><div class="section card"><h2>Actions rapides</h2><div class="quick"><button onclick="openClient()">👤<b>Nouveau client</b><small>Créer une fiche</small></button><button onclick="openEvent()">📅<b>Nouveau rendez-vous</b><small>Ajouter à l'agenda</small></button><button onclick="openJob()">🔧<b>Nouvelle intervention</b><small>Rapport de travail</small></button><button onclick="openQuote()">📄<b>Nouveau devis</b><small>Créer un devis</small></button></div></div><div class="grid3 section"><div class="card"><h2>Prochains rendez-vous</h2>${upcoming.map(e=>`<div class="row"><span><b>${esc(e.client||'Sans client')}</b><br><small>${fmt(e.date)} · ${esc(e.time)} · ${esc(e.type)}</small></span><span class="badge">${esc(e.status||'Planifié')}</span></div>`).join('')||'<div class="empty">Aucun rendez-vous.</div>'}</div><div class="card"><h2>Alertes</h2><div class="row"><span>Entretiens à prévoir</span><b>${due}</b></div><div class="row"><span>Factures impayées</span><b>${unpaid}</b></div><div class="row"><span>Rappels</span><b>${db.reminders.filter(r=>!r.done).length}</b></div></div><div class="card"><h2>Chiffre facturé</h2><div class="n" style="font-size:28px;font-weight:850">${db.invoices.reduce((s,i)=>s+Number(i.total||0),0).toFixed(2)} €</div><small style="color:var(--muted)">Total des factures enregistrées</small></div></div>`}
function clients(){const q=($('cq')?.value||'').toLowerCase();$('content').innerHTML=`<div class="card"><div class="actions between"><div class="search"><input id="cq" value="${esc(q)}" placeholder="Rechercher nom, téléphone, ville..." oninput="clients()"></div><button class="btn primary" onclick="openClient()">+ Nouveau client</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Client</th><th>Téléphone</th><th>Adresse</th><th>Dernière intervention</th><th></th></tr></thead><tbody>${db.clients.map((c,i)=>({c,i})).filter(o=>(o.c.name+' '+o.c.phone+' '+o.c.city).toLowerCase().includes(q)).map(o=>`<tr><td><b>${esc(o.c.name)}</b><br><small>${esc(o.c.email)}</small></td><td>${esc(o.c.phone)}</td><td>${esc(o.c.address)}<br>${esc(o.c.zip)} ${esc(o.c.city)}</td><td>${fmt(o.c.last)}</td><td><button class="btn soft" onclick="openClient(${o.i})">Ouvrir</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun client.</td></tr>'}</tbody></table></div></div>`}
function openClient(i=null){const c=i==null?{name:'',phone:'',email:'',address:'',zip:'',city:'',notes:'',last:''}:db.clients[i];$('mt').textContent=i==null?'Nouveau client':'Fiche client';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Nom / prénom</label><input id="cn" value="${esc(c.name)}"></div><div class="field"><label>Téléphone</label><input id="cp" value="${esc(c.phone)}"></div><div class="field"><label>E-mail</label><input id="ce" value="${esc(c.email)}"></div><div class="field"><label>Adresse</label><input id="ca" value="${esc(c.address)}"></div><div class="field"><label>Code postal</label><input id="cz" value="${esc(c.zip)}"></div><div class="field"><label>Ville</label><input id="cv" value="${esc(c.city)}"></div></div><div class="field"><label>Notes</label><textarea id="co">${esc(c.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveClient(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('clients',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveClient(i){const c={name:$('cn').value.trim(),phone:$('cp').value,email:$('ce').value,address:$('ca').value,zip:$('cz').value,city:$('cv').value,notes:$('co').value,last:i!==null?db.clients[i].last:''};if(!c.name)return alert('Le nom du client est obligatoire.');i===null?db.clients.push(c):db.clients[i]=c;save();closeModal();render()}
function agenda(){const y=calDate.getFullYear(),m=calDate.getMonth();const first=new Date(y,m,1).getDay();const offset=(first+6)%7;const days=new Date(y,m+1,0).getDate();let cells='';['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'].forEach(x=>cells+=`<div class="calhead">${x}</div>`);for(let i=0;i<offset;i++)cells+='<div class="day"></div>';for(let d=1;d<=days;d++){const ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const ev=db.events.filter(e=>e.date===ds);cells+=`<div class="day"><div class="daynum">${d}</div>${ev.map((e,i)=>`<div class="eventchip" title="${esc(e.client+' — '+e.type)}" onclick="openEvent(${db.events.indexOf(e)})">${esc(e.time||'')} ${esc(e.client||'')}</div>`).join('')}</div>`}$('content').innerHTML=`<div class="card"><div class="actions between"><div class="actions"><button class="btn soft" onclick="changeMonth(-1)">‹</button><h2 style="margin:0;min-width:150px;text-align:center">${new Intl.DateTimeFormat('fr-BE',{month:'long',year:'numeric'}).format(calDate)}</h2><button class="btn soft" onclick="changeMonth(1)">›</button></div><button class="btn primary" onclick="openEvent()">+ Nouveau rendez-vous</button></div><div class="calwrap"><div class="calendar">${cells}</div></div></div><div class="section card"><h2>Liste des rendez-vous</h2>${eventTable()}</div>`}
function changeMonth(n){calDate.setMonth(calDate.getMonth()+n);render()}
function eventTable(){const arr=[...db.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));return `<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Heure</th><th>Client</th><th>Type</th><th>Statut</th><th></th></tr></thead><tbody>${arr.map(e=>{const i=db.events.indexOf(e);return `<tr><td>${fmt(e.date)}</td><td>${esc(e.time)}</td><td>${esc(e.client)}</td><td>${esc(e.type)}</td><td><span class="badge">${esc(e.status)}</span></td><td><button class="btn soft" onclick="openEvent(${i})">Modifier</button> <button class="btn danger" onclick="remove('events',${i})">Supprimer</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Aucun rendez-vous.</td></tr>'}</tbody></table></div>`}
function openEvent(i=null){const e=i===null?{client:'',date:today(),time:'09:00',type:'Entretien chaudière',status:'Planifié',notes:''}:db.events[i];$('mt').textContent=i===null?'Nouveau rendez-vous':'Modifier le rendez-vous';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Client</label><select id="ec">${clientOptions(e.client)}</select></div><div class="field"><label>Date</label><input id="ed" type="date" value="${esc(e.date)}"></div><div class="field"><label>Heure</label><input id="et" type="time" value="${esc(e.time)}"></div><div class="field"><label>Type</label><input id="ey" value="${esc(e.type)}"></div><div class="field"><label>Statut</label><select id="es">${['Planifié','Confirmé','Terminé','Annulé'].map(s=>`<option ${e.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Notes</label><textarea id="en">${esc(e.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveEvent(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('events',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveEvent(i){const e={client:$('ec').value,date:$('ed').value,time:$('et').value,type:$('ey').value,status:$('es').value,notes:$('en').value};i===null?db.events.push(e):db.events[i]=e;save();closeModal();render()}
function jobs(){const arr=[...db.jobs].sort((a,b)=>b.date.localeCompare(a.date));$('content').innerHTML=`<div class="card"><div class="actions between"><h2>Interventions</h2><button class="btn primary" onclick="openJob()">+ Nouvelle intervention</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Client</th><th>Type</th><th>Statut</th><th>Technicien</th><th></th></tr></thead><tbody>${arr.map(j=>{const i=db.jobs.indexOf(j);return `<tr><td>${fmt(j.date)}</td><td>${esc(j.client)}</td><td>${esc(j.type)}</td><td><span class="badge ${j.status==='Terminée'?'ok':''}">${esc(j.status)}</span></td><td>${esc(j.tech)}</td><td><button class="btn soft" onclick="openJob(${i})">Ouvrir</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Aucune intervention.</td></tr>'}</tbody></table></div></div>`}
function openJob(i=null){const j=i===null?{client:'',date:today(),type:'Dépannage',status:'À venir',tech:'Steve',notes:'',materials:'',duration:''}:db.jobs[i];$('mt').textContent=i===null?'Nouvelle intervention':'Rapport d’intervention';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Client</label><select id="jc">${clientOptions(j.client)}</select></div><div class="field"><label>Date</label><input id="jd" type="date" value="${esc(j.date)}"></div><div class="field"><label>Type</label><input id="jy" value="${esc(j.type)}"></div><div class="field"><label>Statut</label><select id="js">${['À venir','En cours','Terminée','Annulée'].map(s=>`<option ${j.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Technicien</label><input id="jt" value="${esc(j.tech)}"></div><div class="field"><label>Durée</label><input id="jdur" value="${esc(j.duration)}" placeholder="ex. 1h30"></div></div><div class="field"><label>Travail effectué / observations</label><textarea id="jn">${esc(j.notes)}</textarea></div><div class="field"><label>Matériel / pièces</label><textarea id="jm">${esc(j.materials)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveJob(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('jobs',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveJob(i){const j={client:$('jc').value,date:$('jd').value,type:$('jy').value,status:$('js').value,tech:$('jt').value,duration:$('jdur').value,notes:$('jn').value,materials:$('jm').value};i===null?db.jobs.push(j):db.jobs[i]=j;const c=db.clients.find(x=>x.name===j.client);if(c&&j.status==='Terminée')c.last=j.date;save();closeModal();render()}
function maint(){const arr=[...db.maint].sort((a,b)=>(a.next||'9999').localeCompare(b.next||'9999'));$('content').innerHTML=`<div class="card"><div class="actions between"><h2>Entretiens & installations</h2><button class="btn primary" onclick="openMaint()">+ Nouvel entretien</button></div><div class="tablewrap"><table class="table"><thead><tr><th>Client</th><th>Installation</th><th>Dernier</th><th>Prochain</th><th>État</th><th></th></tr></thead><tbody>${arr.map(m=>{const i=db.maint.indexOf(m);const due=m.next&&m.next<=today();return `<tr><td>${esc(m.client)}</td><td>${esc(m.install)}</td><td>${fmt(m.last)}</td><td>${fmt(m.next)}</td><td><span class="badge ${due?'red':'ok'}">${due?'À prévoir':'À jour'}</span></td><td><button class="btn soft" onclick="openMaint(${i})">Modifier</button></td></tr>`}).join('')||'<tr><td colspan="6" class="empty">Aucun entretien.</td></tr>'}</tbody></table></div></div>`}
function openMaint(i=null){const m=i===null?{client:'',install:'Chaudière',last:'',next:'',serial:'',notes:''}:db.maint[i];$('mt').textContent=i===null?'Nouvel entretien':'Fiche entretien';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Client</label><select id="mc">${clientOptions(m.client)}</select></div><div class="field"><label>Installation</label><input id="mi" value="${esc(m.install)}"></div><div class="field"><label>Dernier entretien</label><input id="ml" type="date" value="${esc(m.last)}"></div><div class="field"><label>Prochain entretien</label><input id="mn" type="date" value="${esc(m.next)}"></div><div class="field"><label>N° de série</label><input id="ms" value="${esc(m.serial)}"></div></div><div class="field"><label>Notes installation</label><textarea id="mno">${esc(m.notes)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveMaint(${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('maint',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveMaint(i){const m={client:$('mc').value,install:$('mi').value,last:$('ml').value,next:$('mn').value,serial:$('ms').value,notes:$('mno').value};i===null?db.maint.push(m):db.maint[i]=m;save();closeModal();render()}
function docs(){ $('content').innerHTML=`<div class="card"><div class="actions between"><h2>Documents</h2><button class="btn primary" onclick="openDoc()">+ Ajouter un document</button></div><p style="color:var(--muted);font-size:13px">Espace pour classer les rapports, attestations, photos ou documents liés aux clients. La V2 enregistre les références et notes sur cet appareil.</p><div class="tablewrap"><table class="table"><thead><tr><th>Nom</th><th>Client</th><th>Type</th><th>Date</th><th></th></tr></thead><tbody>${db.docs.map((d,i)=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.client)}</td><td>${esc(d.type)}</td><td>${fmt(d.date)}</td><td><button class="btn danger" onclick="remove('docs',${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Aucun document.</td></tr>'}</tbody></table></div></div>`}
function openDoc(){ $('mt').textContent='Ajouter un document';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Nom du document</label><input id="dnm"></div><div class="field"><label>Client</label><select id="dcl">${clientOptions()}</select></div><div class="field"><label>Type</label><select id="dty"><option>Rapport</option><option>Attestation</option><option>Photo</option><option>Autre</option></select></div><div class="field"><label>Date</label><input id="dda" type="date" value="${today()}"></div></div><div class="field"><label>Notes</label><textarea id="dno"></textarea></div><button class="btn primary" onclick="db.docs.push({name:$('dnm').value,client:$('dcl').value,type:$('dty').value,date:$('dda').value,notes:$('dno').value});save();closeModal();render()">Enregistrer</button>`;$('modal').classList.add('open')}
function reminders(){const all=[...db.reminders];db.maint.filter(m=>m.next&&m.next<=today()).forEach(m=>{if(!all.some(r=>r.source==='maint'&&r.client===m.client&&r.date===m.next))all.push({title:'Entretien à planifier',client:m.client,date:m.next,source:'maint',done:false})});$('content').innerHTML=`<div class="card"><div class="actions between"><h2>Rappels</h2><button class="btn primary" onclick="openReminder()">+ Nouveau rappel</button></div>${all.sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map((r,i)=>`<div class="row ${r.done?'':'overdue'}"><span><b>${esc(r.title)}</b><br><small>${esc(r.client||'')} · ${fmt(r.date)}</small></span><span class="actions"><button class="btn ${r.done?'soft':'gold'}" onclick="toggleReminder(${i})">${r.done?'Fait':'Marquer fait'}</button>${r.source!=='maint'?`<button class="btn danger" onclick="remove('reminders',${db.reminders.indexOf(r)})">×</button>`:''}</span></div>`).join('')||'<div class="empty">Aucun rappel.</div>'}</div>`}
function toggleReminder(i){const r=db.reminders[i];if(r){r.done=!r.done;save();render()}}
function openReminder(){$('mt').textContent='Nouveau rappel';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Titre</label><input id="rt" placeholder="Appeler le client..."></div><div class="field"><label>Client</label><select id="rc">${clientOptions()}</select></div><div class="field"><label>Date</label><input id="rd" type="date" value="${today()}"></div></div><button class="btn primary" onclick="db.reminders.push({title:$('rt').value,client:$('rc').value,date:$('rd').value,done:false});save();closeModal();render()">Enregistrer</button>`;$('modal').classList.add('open')}
function docPage(key,title,prefix,statuses){const arr=[...db[key]];$('content').innerHTML=`<div class="card"><div class="actions between"><h2>${title}</h2><button class="btn primary" onclick="openDocNumber('${key}')">+ ${key==='quotes'?'Nouveau devis':'Nouvelle facture'}</button></div><div class="tablewrap"><table class="table"><thead><tr><th>N°</th><th>Client</th><th>Date</th><th>Total</th><th>Statut</th><th>Description</th><th></th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${esc(x.number)}</td><td>${esc(x.client)}</td><td>${fmt(x.date)}</td><td>${Number(x.total||0).toFixed(2)} €</td><td><span class="badge ${x.status==='Payée'||x.status==='Accepté'?'ok':x.status==='Impayée'||x.status==='Refusé'?'red':''}">${esc(x.status)}</span></td><td>${esc(x.description)}</td><td><button class="btn soft" onclick="openDocNumber('${key}',${i})">Modifier</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">Aucun ${title.toLowerCase()}.</td></tr>`}</tbody></table></div></div>`}
function quotes(){docPage('quotes','Devis','DEV-',['Brouillon','Envoyé','Accepté','Refusé'])}function invoices(){docPage('invoices','Factures','FAC-',['Brouillon','Envoyée','Payée','Impayée'])}
function openQuote(){openDocNumber('quotes')}function openInvoice(){openDocNumber('invoices')}
function openDocNumber(key,i=null){const isQ=key==='quotes',prefix=isQ?'DEV-':'FAC-',statuses=isQ?['Brouillon','Envoyé','Accepté','Refusé']:['Brouillon','Envoyée','Payée','Impayée'];const x=i===null?{number:prefix+String(db[key].length+1).padStart(4,'0'),client:'',date:today(),total:'',status:statuses[0],description:''}:db[key][i];$('mt').textContent=i===null?(isQ?'Nouveau devis':'Nouvelle facture'):(isQ?'Modifier le devis':'Modifier la facture');$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Numéro</label><input id="dnum" value="${esc(x.number)}"></div><div class="field"><label>Client</label><select id="docc">${clientOptions(x.client)}</select></div><div class="field"><label>Date</label><input id="docd" type="date" value="${esc(x.date)}"></div><div class="field"><label>Total TVAC (€)</label><input id="doct" type="number" step="0.01" value="${esc(x.total)}"></div><div class="field"><label>Statut</label><select id="docsx">${statuses.map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="field"><label>Description</label><textarea id="docdesc">${esc(x.description)}</textarea></div><div class="actions"><button class="btn primary" onclick="saveDoc('${key}',${i===null?'null':i})">Enregistrer</button>${i!==null?`<button class="btn danger" onclick="remove('${key}',${i})">Supprimer</button>`:''}</div>`;$('modal').classList.add('open')}
function saveDoc(key,i){const x={number:$('dnum').value,client:$('docc').value,date:$('docd').value,total:$('doct').value,status:$('docsx').value,description:$('docdesc').value};i===null?db[key].push(x):db[key][i]=x;save();closeModal();render()}
function settings(){const s=db.settings;$('content').innerHTML=`<div class="card"><h2>Entreprise</h2><div class="formgrid"><div class="field"><label>Nom de l'entreprise</label><input id="sn" value="${esc(s.company)}"></div><div class="field"><label>Téléphone</label><input id="sp" value="${esc(s.phone)}"></div><div class="field"><label>E-mail</label><input id="se" value="${esc(s.email)}"></div><div class="field"><label>TVA</label><input id="sv" value="${esc(s.vat)}"></div><div class="field"><label>Adresse</label><input id="sa" value="${esc(s.address)}"></div><div class="field"><label>Utilisateur</label><input id="su" value="${esc(s.user)}"></div></div><button class="btn primary" onclick="saveSettings()">Enregistrer les paramètres</button></div><div class="section card"><h2>Services & tarifs</h2><button class="btn primary" onclick="openService()">+ Ajouter un service</button><div class="tablewrap"><table class="table"><thead><tr><th>Service</th><th>Prix</th><th></th></tr></thead><tbody>${db.services.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${Number(x.price||0).toFixed(2)} €</td><td><button class="btn danger" onclick="remove('services',${i})">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Aucun service personnalisé.</td></tr>'}</tbody></table></div></div><div class="section card"><h2>Données</h2><div class="actions"><button class="btn soft" onclick="demoData()">Charger des données de test</button><button class="btn danger" onclick="resetAll()">Tout réinitialiser</button></div><p style="color:var(--muted);font-size:12px">Les données sont stockées localement sur cet appareil dans cette version de test.</p></div>`}
function saveSettings(){db.settings={company:$('sn').value,phone:$('sp').value,email:$('se').value,vat:$('sv').value,address:$('sa').value,user:$('su').value};save();alert('Paramètres enregistrés.');render()}
function openService(){$('mt').textContent='Nouveau service';$('mb').innerHTML=`<div class="formgrid"><div class="field"><label>Nom du service</label><input id="svname"></div><div class="field"><label>Prix (€)</label><input id="svprice" type="number" step="0.01"></div></div><button class="btn primary" onclick="db.services.push({name:$('svname').value,price:$('svprice').value});save();closeModal();render()">Enregistrer</button>`;$('modal').classList.add('open')}
function demoData(){db.clients=[{name:'Jean Dupont',phone:'0470 00 00 00',email:'jean@example.be',address:'Rue de la Gare 12',zip:'1420',city:'Braine-l’Alleud',notes:'Chaudière Buderus',last:'2026-09-18'},{name:'Marie Martin',phone:'0471 11 11 11',email:'marie@example.be',address:'Rue du Centre 8',zip:'1440',city:'Braine-le-Château',notes:'Entretien annuel',last:'2026-09-02'}];db.events=[{client:'Jean Dupont',date:'2026-09-26',time:'09:00',type:'Entretien chaudière',status:'Planifié',notes:''},{client:'Marie Martin',date:'2026-09-26',time:'14:00',type:'Dépannage',status:'Confirmé',notes:''}];db.jobs=[{client:'Jean Dupont',date:'2026-09-18',type:'Entretien chaudière',status:'Terminée',tech:'Steve',duration:'1h15',notes:'Entretien effectué.',materials:''}];db.maint=[{client:'Jean Dupont',install:'Chaudière Buderus',last:'2026-09-18',next:'2027-09-18',serial:'BD-001',notes:''},{client:'Marie Martin',install:'Chaudière mazout',last:'2025-09-02',next:'2026-09-25',serial:'MM-002',notes:''}];db.quotes=[{number:'DEV-0001',client:'Marie Martin',date:'2026-09-20',total:'650',status:'Envoyé',description:'Remplacement pièce'}];db.invoices=[{number:'FAC-0001',client:'Jean Dupont',date:'2026-09-18',total:'145',status:'Payée',description:'Entretien chaudière'}];db.reminders=[{title:'Rappeler pour devis',client:'Marie Martin',date:'2026-09-28',done:false}];save();go('home')}
function remove(k,i){if(i<0)return;if(confirm('Supprimer cet élément ?')){db[k].splice(i,1);save();closeModal();render()}}function resetAll(){if(confirm('Supprimer toutes les données enregistrées sur cet appareil ?')){db=JSON.parse(JSON.stringify(blank));save();render()}}function closeModal(){$('modal').classList.remove('open')}
if(sessionStorage.sd2==='1')start();
</script>
